<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.2" baseProfile="tiny-ps" xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    <defs>
        <!-- Dégradé futuriste Bleu -> Violet -->
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00f2ff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#bc13fe;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- Fond circulaire pour l'intégration mail (optionnel, peut être transparent) -->
    <circle cx="256" cy="256" r="250" fill="#0a0b10" />

    <!-- Hexagone de protection (Le Bouclier) -->
    <polygon points="256,40 440,140 440,372 256,472 82,372 82,140" 
             fill="none" 
             stroke="url(#grad1)" 
             stroke-width="20" 
             stroke-linejoin="round" />

    <!-- Le X stylisé (Le Network/Core) -->
    <!-- Branche 1 -->
    <path d="M150,150 L362,362" 
          stroke="url(#grad1)" 
          stroke-width="40" 
          stroke-linecap="round" />
    <!-- Branche 2 -->
    <path d="M362,150 L150,362" 
          stroke="url(#grad1)" 
          stroke-width="40" 
          stroke-linecap="round" />
    
    <!-- Points de connexion (Nodes) pour l'aspect réseau -->
    <circle cx="150" cy="150" r="15" fill="#00f2ff" />
    <circle cx="362" cy="150" r="15" fill="#00f2ff" />
    <circle cx="150" cy="362" r="15" fill="#bc13fe" />
    <circle cx="362" cy="362" r="15" fill="#bc13fe" />
</svg>
