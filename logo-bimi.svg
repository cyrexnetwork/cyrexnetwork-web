<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.2" baseProfile="tiny-ps" xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    <!-- Fond circulaire noir solide pour éviter toute transparence problématique -->
    <circle cx="256" cy="256" r="256" fill="#0a0b10" />

    <!-- Hexagone de protection - Couleur Bleu Électrique Solide -->
    <polygon points="256,40 440,140 440,372 256,472 82,372 82,140" 
             fill="none" 
             stroke="#00f2ff" 
             stroke-width="20" 
             stroke-linejoin="round" />

    <!-- Le X stylisé - Couleur Bleu Électrique Solide -->
    <!-- Branche 1 -->
    <path d="M150,150 L362,362" 
          stroke="#00f2ff" 
          stroke-width="40" 
          stroke-linecap="round" />
    <!-- Branche 2 -->
    <path d="M362,150 L150,362" 
          stroke="#00f2ff" 
          stroke-width="40" 
          stroke-linecap="round" />
    
    <!-- Points de connexion (Nodes) -->
    <circle cx="150" cy="150" r="15" fill="#00f2ff" />
    <circle cx="362" cy="150" r="15" fill="#00f2ff" />
    <circle cx="150" cy="362" r="15" fill="#00f2ff" />
    <circle cx="362" cy="362" r="15" fill="#00f2ff" />
</svg>
